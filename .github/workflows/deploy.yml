name: Deploy Artifact

# Builds and pushes the four runtime images. Deploy them with the runbook in engineering/RUNBOOK.md
# (migrate first, then API + worker, then web apps).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, worker, storefront, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.API_PUBLIC_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.STOREFRONT_URL }}
            NEXT_PUBLIC_STOREFRONT_URL=${{ vars.STOREFRONT_URL }}
            NEXT_PUBLIC_STORE_BRAND_SLUG=${{ vars.STORE_BRAND_SLUG }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.CLERK_PUBLISHABLE_KEY }}
          tags: |
            ghcr.io/${{ github.repository }}/restaurant-os-${{ matrix.target }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/restaurant-os-${{ matrix.target }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
