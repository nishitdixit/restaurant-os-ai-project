name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.12.4, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Unit + integration tests (real Postgres)
        run: pnpm test
      - name: Migration check on a fresh database
        env: { DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ci_migrations" }
        run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -c "CREATE DATABASE ci_migrations"
          pnpm db:setup && pnpm db:migrate && pnpm db:status
      - name: Build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY || 'pk_test_Y2kuZXhhbXBsZS5jb20k' }}
        run: pnpm build
      - name: End-to-end (storefront against API + worker)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_migrations
          E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_migrations
          REDIS_URL: redis://localhost:6379
          NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
        run: |
          pnpm --filter @restaurant-os/e2e exec playwright install --with-deps chromium
          (cd apps/api && node dist/main.js &) && (cd apps/api && node dist/worker.js &)
          cp -r apps/storefront/.next/static apps/storefront/.next/standalone/apps/storefront/.next/static
          (cd apps/storefront/.next/standalone && PORT=3000 node apps/storefront/server.js &)
          npx wait-on -t 60000 http://localhost:4000/ready http://localhost:3000/robots.txt
          pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: tests/e2e/playwright-report }
